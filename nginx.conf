server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript text/plain image/svg+xml;
  add_header Cache-Control "no-cache" always;
  add_header X-Content-Type-Options "nosniff" always;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  # The next-step script, on a domain this repo controls, so that the one URL
  # people may already have piped into a shell never has to move again.
  location = /0th {
    default_type text/x-shellscript;
    add_header Content-Disposition 'inline; filename="0th"' always;
  }

  location / { try_files $uri $uri/ $uri/index.html =404; }
}
