name: ci
on:
  push:
  pull_request:
  # Nothing here is allowed to rot quietly: re-read upstream once a day even
  # when nobody has touched the repo, so a price that moves is news the same
  # week rather than whenever somebody happens to open a pull request.
  schedule:
    - cron: '17 6 * * *'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - run: npm ci
      - run: ./scripts/check.sh
